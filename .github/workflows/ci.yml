name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI 只需读取代码并执行检查
permissions:
  contents: read

jobs:
  backend-tests:
    name: 后端检查（Python 3.8）
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: 设置 Python 3.8
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: python -m ruff check src/ main.py gunicorn.conf.py

      - name: Pytest 后端测试
        env:
          JWT_SECRET_KEY: ci-test-secret-key
        run: python -m pytest tests/ -v --tb=short

  frontend-build:
    name: 前端构建检查（Node 20）
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: 设置 Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build
